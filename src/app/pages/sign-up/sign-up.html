<app-navbar mode="signup" />

<div class="login container">
  <div class="login-container">
    <h2>Welcome, Let's get started</h2>
    <p>Already have an account? <a routerLink="/login">Log In</a></p>

    <form (ngSubmit)="onSubmit()">
      <span>Full Name</span>
      <input type="text" name="fullName" [(ngModel)]="fullName" placeholder="Your Name" required>
      <span>Enter your email address</span>
      <input type="email" name="email" [(ngModel)]="email" placeholder="yourmail@gmail.com" required>
      <span>Phone</span>
      <input type="tel" name="phone" [(ngModel)]="phone" placeholder="Enter your number" required>
      <span>Enter your password</span>
      <input type="password" name="password" [(ngModel)]="password" placeholder="********" minlength="6" required>

      @if (errorMsg()) {
        <p class="error">{{ errorMsg() }}</p>
      }
      @if (successMsg()) {
        <p class="success">{{ successMsg() }}</p>
      }

      <input type="submit" [value]="loading() ? 'Please wait...' : 'Sign up'" class="button" [disabled]="loading()">
      <a routerLink="/login">Already have an account?</a>
    </form>

    <a routerLink="/login" class="btn">Log in</a>
  </div>

  <div class="login-image">
    <img src="images/sign-up.jpg" alt="">
  </div>
</div>

<app-footer />

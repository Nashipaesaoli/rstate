<app-navbar mode="login" />

<div class="login container">
  <div class="login-container">
    <h2>Login To Continue</h2>
    <p>Log in with your data that you used <br> when signing up.</p>

    <form (ngSubmit)="onSubmit()">
      <span>Enter your email</span>
      <input type="email" name="email" [(ngModel)]="email" placeholder="yourmail@gmail.com" required>
      <span>Enter your password</span>
      <input type="password" name="password" [(ngModel)]="password" placeholder="********" required>

      @if (errorMsg()) {
        <p class="error">{{ errorMsg() }}</p>
      }

      <input type="submit" [value]="loading() ? 'Please wait...' : 'Log in'" class="button" [disabled]="loading()">
      <a href="#">Forgot Password?</a>
    </form>

    <a routerLink="/sign-up" class="btn">Sign Up now</a>
  </div>

  <div class="login-image">
    <img src="images/login.png" alt="">
  </div>
</div>

<app-footer />
